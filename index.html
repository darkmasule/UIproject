<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interface</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud">
    <h1>BlueWhale</h1>

    <input type="text" placeholder="Username" id="username" class="input">
    <input type="password" placeholder="Password" id="password" class="input">
    <div class="buttongroup">
        <button id="signup">Sign-up</button>
        <button id="login">Log-In</button>
    </div>
    </div>

    <div class="registerpanel" id="registerpanel">
        <button class="rpclose" id="rpclose">X</button>
        <h1>Sign-up</h1>
        <input type="text" placeholder="username" id="rgusername">
        <input type="email" placeholder="12345@gmail.com" id="rgemail">
        <input type="password" placeholder="password" id="rgpassword">
        <button id="register">Register</button>
    </div>

</body>
</html>
